networks:
  ShoppingCartNetwork:
    driver: bridge
  supabase:
    external: true
    name: supabase_network_Sociophilia  # or whatever your Supabase network is called

services:
  backend:
    build:
      context: ./api
      dockerfile: backend.dockerfile
    container_name: shoppingcart-backend
    ports:
      - "${BACKEND_P}:${BACKEND_P}"
    environment:
      - BASE_SERVER_NAME=${BASE_SERVER_NAME}
      - CONTAINER_APP_PORT=${BACKEND_P}
      - FRONTEND_P=${FRONTEND_P}
      - ConnectionStrings__DefaultConnection=${ConnectionStrings__DefaultConnection}
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=${BACKEND_P}
    networks:
      - ShoppingCartNetwork
      - supabase

  frontend:
    build:
      context: .
      dockerfile: frontend.dockerfile
      args:
        - BASE_SERVER_NAME=${BASE_SERVER_NAME}
        - CONTAINER_APP_PORT=${FRONTEND_P}
        - BACKEND_P=${BACKEND_P}
        - ENVIRONMENT=${ENVIRONMENT}
    container_name: shoppingcart-frontend
    ports:
      - "${FRONTEND_P}:${FRONTEND_P}"
    environment:
      - ENVIRONMENT=${ENVIRONMENT}
      - BASE_SERVER_NAME=${BASE_SERVER_NAME}
      - CONTAINER_APP_PORT=${FRONTEND_P}
      - BACKEND_P=${BACKEND_P}
    networks:
      - ShoppingCartNetwork