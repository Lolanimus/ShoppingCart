name: Trigger auto deployment for shoppingcart-prod-backend

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ main ]
    paths:
    - '**'
    - '.github/workflows/shoppingcart-prod-backend-AutoDeployTrigger-81ff1499-ccbf-4a52-ac4a-e25477c0f8fe.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v1
        with:
          client-id: ${{ secrets.SHOPPINGCARTPRODBACKEND_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.SHOPPINGCARTPRODBACKEND_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.SHOPPINGCARTPRODBACKEND_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}/api/backend.dockerfile
          _dockerfilePathKey_: _dockerfilePath_
          registryUrl: docker.io
          registryUsername: ${{ secrets.SHOPPINGCARTPRODBACKEND_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.SHOPPINGCARTPRODBACKEND_REGISTRY_PASSWORD }}
          containerAppName: shoppingcart-prod-backend
          resourceGroup: ShoppingCart
          imageToBuild: lolanimus/shoppingcart-prod-backend:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


