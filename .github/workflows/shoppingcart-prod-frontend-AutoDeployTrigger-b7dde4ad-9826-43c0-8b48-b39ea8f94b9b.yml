name: Trigger auto deployment for shoppingcart-prod-frontend

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ main ]
    paths:
    - '**'
    - '.github/workflows/shoppingcart-prod-frontend-AutoDeployTrigger-b7dde4ad-9826-43c0-8b48-b39ea8f94b9b.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v1
        with:
          client-id: ${{ secrets.SHOPPINGCARTPRODFRONTEND_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.SHOPPINGCARTPRODFRONTEND_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.SHOPPINGCARTPRODFRONTEND_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}/frontend.dockerfile
          _dockerfilePathKey_: _dockerfilePath_
          registryUrl: docker.io
          registryUsername: ${{ secrets.SHOPPINGCARTPRODFRONTEND_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.SHOPPINGCARTPRODFRONTEND_REGISTRY_PASSWORD }}
          containerAppName: shoppingcart-prod-frontend
          resourceGroup: ShoppingCart
          imageToBuild: lolanimus/shoppingcart-prod-frontend:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


